<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sprite Editor</title>

  <link rel="stylesheet" href="css/editor.css">
  <script type="module">
    import SpriteEditor from './js/SpriteEditor.js';
    const spriteEditor = SpriteEditor.getInstance(document.getElementById('editor'), document.getElementById('preview'));
  </script>
</head>
<body>
  <h1>Sprite Editor</h1>
  <p class="hint">
    Left click / drag to paint with the foreground color &middot;
    right click / drag to erase with the background color &middot;
    hover a cell to inspect it.
  </p>

  <div class="layout">
    <div id="editor-area">
      <canvas id="editor" width="512" height="512"></canvas>
      <div id="editor-tabs">
        <div class="tabs">
          <label class="selected">Toolbar</label>
          <label>Filters</label>
          <label>Animation</label>
        </div>
        <div id="editor-toolbar" class="tab visible"></div>
        <div id="editor-filters" class="tab">
          <div class="filter-selection">
            <label for="filter-list">Filter: <select id="filter-list"></select></label>
            <button id="apply-filter" class="primary visible">Apply Filter</button>
          </div>
          <div id="filter-inputs">
            <div id="tool-inputs">
            </div>
          </div>
        </div>
        <div id="editor-animation" class="tab"></div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Colors</div>
      <div class="row">
        <label>Foreground <input type="color" id="fg" value="#ffffff" alpha/><input type="range" id="fg-alpha" min="0" max="1" step="0.01" value="1.0"></label>
        <label>Background <input type="color" id="bg" value="#000000" alpha/><input type="range" id="bg-alpha" min="0" max="1" step="0.01" value="0.0"></label>
      </div>
      <div id="previous-colors" class="row"></div>

      <div class="section-title">Zoom</div>
      <div class="row">
        <button id="zoomIn">Zoom in</button>
        <button id="zoomOut">Zoom out</button>
        <button id="zoomReset">Reset</button>
      </div>

      <div class="section-title">Grid</div>
      <div class="row">
        <label>Cells <input type="number" id="cells" value="16" min="1" max="128" /></label>
        <button id="applyCells">Apply</button>
        <button id="clearGrid">Clear</button>
      </div>

      <div class="section-title">Sprite</div>
      <div class="row">
        <label>Load <input type="file" id="load" accept="image/*" /></label>
        <button id="export" class="primary">Export PNG</button>
      </div>

      <div class="section-title">Preview (1px per cell)</div>
      <div class="row two-column">
        <div id="preview-sizes">
          <button id="size-256">256</button>
          <button id="size-128">128</button>
          <button id="size-64">64</button>
          <button id="size-32">32</button>
        </div>
        <canvas id="preview" width="16" height="16"></canvas>
      </div>
      <div id="hover">hover: &mdash;</div>
    </div>
  </div>
</body>
</html>
