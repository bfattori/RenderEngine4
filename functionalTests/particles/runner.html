<!DOCTYPE html>
<html>
    <head>
        <title>Render Engine 4 - Particle Engine (multi-object threaded)</title>
        <link rel="stylesheet" href="../../src/re4.css">
        <link rel="stylesheet" href="../../src/re4_debug.css">
        <script src="../../devtools/protocol/messages.js"></script>
        <script src="../../devtools/bridge/re4-debug-bridge.js"></script>
        <script src="../../src/engine/renderEngine4_debug.js" type="module"></script>
        <script type="module">
            await (async () => {
                const params = new URLSearchParams(window.location.search);
                const jsFile = params.get("js"); // is the number 123
                const module = await import(new URL(`js/${jsFile}/index.js`, import.meta.url));
                return module.default; 
            })();
        </script>
        <style>
            #context.types-and-effects {
                background-color: black;
            }
        </style>
    </head>
    <body>
        <div id="context"></div>        
    </body>
</html>
